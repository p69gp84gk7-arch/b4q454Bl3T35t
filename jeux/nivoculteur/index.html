<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nivoculteur · DesDés</title>
<meta name="theme-color" content="#0B1426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DesDés">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0B1426; --nuit-2:#13213D; --texte:#EAF2FF; --doux:rgba(234,242,255,.68);
  --verre:rgba(11,20,38,.72); --bord:rgba(234,242,255,.16);
  --info:#2F6FDE; --ok:#2E9E5B; --attention:#E58A1F; --alarme:#D7263D; --or:#E9B949;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; background:var(--nuit); color:var(--texte);
  font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select:none; user-select:none; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; }
button:focus-visible, a:focus-visible{ outline:3px solid var(--or); outline-offset:2px; }
[hidden]{ display:none !important; }

#scene{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

/* ---------- Bandeau du haut ---------- */
.haut{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 12px) 18px calc(env(safe-area-inset-left, 0px) + 12px);
  background:linear-gradient(rgba(5,11,28,.85), rgba(5,11,28,0)); pointer-events:none; }
.haut > *{ pointer-events:auto; }
.home{ display:inline-flex; align-items:center; gap:6px; color:var(--doux); text-decoration:none; font-weight:600; font-size:.95rem;
  padding:8px 10px; border-radius:10px; background:var(--verre); border:1px solid var(--bord); white-space:nowrap; }
.home::before{ content:"←"; }
.home:hover{ color:var(--texte); }
.titre{ flex:1; min-width:0; line-height:1.1; }
.titre b{ display:block; font-size:1.25rem; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titre span{ display:block; font-size:.82rem; color:var(--doux); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bouton{ padding:9px 12px; border-radius:10px; background:var(--verre); border:1px solid var(--bord); font-weight:600; font-size:.9rem; white-space:nowrap; text-decoration:none; color:var(--texte); }
.bouton:hover{ background:rgba(47,111,222,.35); }
.bouton.actif{ background:#2F6FDE; border-color:#2F6FDE; }

/* ---------- Messages (bleu = info, vert = OK, orange = attention, rouge = alarme) ---------- */
#messages{ position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top, 0px) + 66px);
  width:min(520px, calc(100% - 24px)); display:flex; flex-direction:column; gap:6px; pointer-events:none; }
.message{ padding:9px 12px; border-radius:10px; font-size:.92rem; line-height:1.3; background:var(--verre);
  border-left:5px solid var(--info); box-shadow:0 6px 18px rgba(0,0,0,.35); transition:opacity .4s ease, transform .4s ease; }
.message.ok{ border-left-color:var(--ok); }
.message.attention{ border-left-color:var(--attention); }
.message.alarme{ border-left-color:var(--alarme); background:rgba(80,10,20,.82); }
.message.sortie{ opacity:0; transform:translateY(-6px); }

/* ---------- Barre du bas ---------- */
.bas{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
  padding:18px calc(env(safe-area-inset-right, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 12px);
  background:linear-gradient(rgba(5,11,28,0), rgba(5,11,28,.85)); pointer-events:none; }
.bas > *{ pointer-events:auto; }
.stat{ min-width:96px; padding:7px 12px; border-radius:12px; background:var(--verre); border:1px solid var(--bord); text-align:center; }
.stat > span{ display:block; white-space:nowrap; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--doux); }
.stat b{ display:block; font-size:1.05rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
/* ---------- Construction : consigne, devis, outils ---------- */
.bas.jeu{ flex-direction:column; align-items:center; gap:6px; }
.bas .rang{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:760px; }
.consigne{ max-width:min(560px, 100%); padding:7px 12px; border-radius:10px; font-size:.88rem; line-height:1.3; text-align:center;
  background:var(--verre); border:1px solid var(--bord); color:var(--texte); }
.devis{ width:min(520px, 100%); padding:10px 12px; border-radius:12px; background:rgba(11,20,38,.94); border:1px solid var(--or); box-shadow:0 8px 22px rgba(0,0,0,.4); }
.devis .tete{ display:flex; justify-content:space-between; gap:10px; font-weight:800; font-size:1rem; }
.devis ul{ margin:6px 0 8px; padding-left:18px; font-size:.86rem; line-height:1.35; color:var(--doux); }
.devis .refus{ color:#FF8A96; font-weight:700; font-size:.88rem; margin:0 0 8px; }
.devis .actions{ display:flex; gap:8px; justify-content:flex-end; }
.devis .actions .bouton:first-child{ background:var(--ok); border-color:var(--ok); }
.devis .actions .bouton:disabled{ opacity:.45; cursor:default; }
.outils .bouton{ font-size:.86rem; padding:8px 11px; }
.outils .bouton:disabled{ opacity:.4; cursor:default; }
.outil.actif[data-outil="regard"]{ background:#E58A1F; border-color:#E58A1F; }
.outil.actif[data-outil="eau"]{ background:#2F6FDE; border-color:#2F6FDE; }
.outil.actif[data-outil="cable"]{ background:#E9B949; border-color:#E9B949; color:#1C1F25; }
.outil.actif[data-outil="air"]{ background:#E8EDF5; border-color:#E8EDF5; color:#1C1F25; }
#sousSol.actif{ background:#5C6B86; border-color:#9FB0CF; }
.bouton.nuit{ background:#2E9E5B; border-color:#2E9E5B; }
#accelerer.actif{ background:#E9B949; border-color:#E9B949; color:#1C1F25; }
.en-nuit .construction{ display:none; }
.stat b em{ font-style:normal; }
.stat b .fleche{ width:15px; height:15px; vertical-align:-2px; transition:transform .3s ease; color:#9FD0FF; }
.choix{ align-items:center; font-size:.82rem; color:var(--doux); }
.choix label{ display:inline-flex; align-items:center; gap:5px; }
.choix select{ font:inherit; color:var(--texte); background:var(--verre); border:1px solid var(--bord); border-radius:8px; padding:5px 6px; max-width:min(300px, 62vw); }
.choix select option:disabled{ color:#7B8494; }
.devis .ligne{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0; font-size:.88rem; }
.devis .ligne b{ min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
.devis .petit{ padding:5px 10px; font-size:.85rem; }
/* Fiche d'un canon : panneau à gauche sur grand écran, volet qui monte du bas sur téléphone */
.devis.fiche{ position:fixed; z-index:15; overflow:auto; overscroll-behavior:contain; }
@media (min-width:700px) and (orientation:landscape){
  .devis.fiche{ left:calc(env(safe-area-inset-left, 0px) + 12px); top:64px; width:min(380px, 42vw); max-height:calc(100dvh - 78px); animation:ficheGauche .25s ease-out; }
}
@media not all and (min-width:700px) and (orientation:landscape){
  .devis.fiche{ left:0; right:0; bottom:0; width:auto; max-height:56dvh; border-radius:18px 18px 0 0; border-bottom:0;
    padding:6px 14px calc(env(safe-area-inset-bottom, 0px) + 12px); animation:ficheBas .28s ease-out; }
  .devis.fiche::before{ content:''; display:block; width:44px; height:5px; border-radius:3px; background:#3A4A66; margin:2px auto 8px; }
}
@keyframes ficheGauche{ from{ transform:translateX(-110%); } to{ transform:none; } }
@keyframes ficheBas{ from{ transform:translateY(100%); } to{ transform:none; } }
.devis.fiche .choix select{ flex:1 1 140px; min-width:0; max-width:100%; }
.devis .ligne.panne{ justify-content:space-between; padding:6px 9px; border-radius:8px; background:rgba(255,210,58,.12); border-left:4px solid #FFD23A; }
.devis .reglage-fiche input{ flex:1 1 140px; min-width:0; height:28px; accent-color:#E9B949; }
.devis .mesure{ flex:1 1 auto; }
.devis .fermer{ background:none; border:0; color:var(--doux); font-size:1.3rem; line-height:1; padding:0 4px; cursor:pointer; }

/* ---------- Vitrine des modèles ---------- */
.vitrine{ flex-direction:column; align-items:center; gap:8px; }
.vitrine .rang{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:760px; }
.vitrine .rang .bouton{ font-size:.85rem; padding:8px 10px; }
.vitrine .options .bouton{ background:rgba(233,185,73,.16); border-color:rgba(233,185,73,.45); }

/* ---------- Poste de travail (écran de supervision) ---------- */
.poste{ position:fixed; z-index:20; inset:calc(env(safe-area-inset-top, 0px) + 8px) 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
  max-width:1000px; margin:0 auto; overflow:auto; padding:12px 14px; border-radius:14px; background:#07111E; border:2px solid #2B3B55;
  box-shadow:0 20px 50px rgba(0,0,0,.6); font-variant-numeric:tabular-nums; }
.poste .tete{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.poste h2{ margin:0; font-size:1.1rem; }
.poste h3{ margin:0 0 8px; font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:#7FB2FF; }
.poste .fermer{ background:none; border:0; color:var(--doux); font-size:1.6rem; line-height:1; padding:0 6px; cursor:pointer; }
.poste .disposition{ display:grid; gap:10px; grid-template-columns:minmax(0, 1fr) minmax(300px, 400px); align-items:start; margin-top:10px; }
.poste .grille{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); min-width:0; }
.poste .colonne{ position:sticky; top:0; max-height:calc(100dvh - 90px); overflow:auto; }
@media (max-width:820px){ .poste .disposition{ grid-template-columns:minmax(0, 1fr); } .poste .colonne{ position:static; max-height:none; overflow:visible; } }
.poste .bloc{ background:#0D1B2E; border:1px solid #22324A; border-radius:12px; padding:10px 12px; min-width:0; }
.poste .ligne{ display:flex; align-items:center; gap:6px 8px; flex-wrap:wrap; margin:6px 0; font-size:.88rem; }
.poste .pompe{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 0; border-bottom:1px solid #1A2A40; font-size:.9rem; }
.poste .led{ width:12px; height:12px; border-radius:50%; flex:none; box-shadow:0 0 6px currentColor; }
.poste .val{ min-width:46px; text-align:center; }
.poste .reglage{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.poste .pastille{ display:inline-block; padding:3px 9px; border-radius:999px; background:#13243B; border:1px solid #22324A; font-size:.8rem; white-space:nowrap; }
.poste .pastille.vert{ background:rgba(46,158,91,.25); border-color:#2E9E5B; }
.poste .bouton.petit{ padding:5px 10px; font-size:.82rem; }
.poste .seg{ display:inline-flex; border:1px solid #2B3B55; border-radius:10px; overflow:hidden; }
.poste .seg button{ padding:6px 12px; background:none; font-size:.85rem; font-weight:600; }
.poste .seg .actif{ background:#2F6FDE; }
.poste .seg.large{ display:flex; width:100%; }
.poste .seg.large button{ flex:1 1 0; min-width:0; padding:6px 2px; white-space:nowrap; }
.poste .aide, .poste .vide{ margin:6px 0 0; font-size:.8rem; color:var(--doux); }
.poste .alarme{ margin:0 0 6px; padding:6px 9px; border-radius:8px; font-size:.84rem; line-height:1.3; border-left:4px solid var(--attention); background:rgba(229,138,31,.12); }
.poste .alarme.rouge{ border-left-color:var(--alarme); background:rgba(215,38,61,.18); }
.poste .canons{ display:grid; gap:6px; }
.poste .canon{ padding:7px 9px; background:#0A1626; border:1px solid #22324A; border-radius:10px; min-width:0; }
.poste .canon .entete, .poste .canon .pied{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; }
.poste .canon .nom{ flex:1 1 110px; min-width:0; line-height:1.15; }
.poste .canon .pied{ margin-top:2px; }
.poste .canon .nom small{ display:block; color:var(--doux); font-size:.75rem; }
.poste .canon .actions{ display:flex; gap:6px; margin-left:auto; }

/* Curseur de la vanne */
.poste .curseur{ width:100%; margin:4px 0 2px; accent-color:#2F6FDE; height:28px; }
.poste .pastille.orange{ background:rgba(229,138,31,.22); border-color:#E58A1F; }
.poste .pastille.rouge{ background:rgba(215,38,61,.2); border-color:#D7263D; }
.poste .bouton.vert{ background:var(--ok); border-color:var(--ok); }
.poste .resume{ margin:0 0 8px; }
.poste .reglage-bac input{ flex:1 1 120px; min-width:0; height:28px; accent-color:#E9B949; }
.poste .panne{ display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px; padding:7px 0; border-bottom:1px solid #1A2A40; font-size:.88rem; }
.poste .panne .nom{ flex:1 1 140px; min-width:0; line-height:1.15; }
.poste .panne .nom small{ display:block; color:var(--doux); font-size:.75rem; }
.poste .panne .actions{ display:flex; gap:6px; margin-left:auto; }
/* Jauges de pression */
.mesure{ display:flex; align-items:center; gap:8px; margin:6px 0 2px; min-width:0; }
.mesure b{ min-width:52px; text-align:right; font-size:.85rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
.jauge{ position:relative; display:block; flex:1 1 auto; min-width:90px; height:10px; border-radius:5px; background:#13243B; }
.jauge span{ position:absolute; top:0; bottom:0; opacity:.85; }
.jauge span:first-child{ border-radius:5px 0 0 5px; }
.jauge span:nth-last-child(1), .jauge span:nth-last-child(2):has(+ i){ border-radius:0 5px 5px 0; }
.jauge .bon{ background:#2E9E5B; } .jauge .moyen{ background:#E58A1F; } .jauge .mauvais{ background:#D7263D; }
.jauge i{ position:absolute; top:-4px; width:4px; height:18px; margin-left:-2px; background:#FFFFFF; border-radius:2px; box-shadow:0 0 0 1px #0B1426, 0 0 6px rgba(255,255,255,.6); transition:left .25s; }
.graduations{ display:flex; justify-content:space-between; font-size:.7rem; color:var(--doux); margin-bottom:4px; }
/* Menu des niveaux */
.menu{ max-width:720px; z-index:25; }
.menu .intro{ margin:6px 0 12px; color:var(--doux); font-size:.92rem; line-height:1.4; }
.menu .niveaux{ display:grid; gap:10px; }
.menu .niveau{ display:flex; gap:12px; padding:12px; background:#0D1B2E; border:1px solid #22324A; border-radius:14px; }
.menu .niveau.ferme{ opacity:.55; }
.menu .num{ flex:none; width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-weight:800; font-size:1.3rem; background:#13243B; border:1px solid #2B3B55; }
.menu .corps{ min-width:0; flex:1; }
.menu h3{ margin:0 0 4px; font-size:1.05rem; text-transform:none; letter-spacing:0; color:var(--texte); }
.menu .corps p{ margin:0 0 6px; font-size:.86rem; line-height:1.35; color:var(--doux); }
.menu .etat{ color:#9FD0FF !important; font-weight:600; }
.menu .actions{ display:flex; gap:8px; flex-wrap:wrap; }
.menu .bouton.vert{ background:#2E9E5B; border-color:#2E9E5B; }
.menu .bas-menu{ margin-top:12px; justify-content:center; }
.sans-construction .construction:not(#lancerNuit){ display:none; }

/* ---------- Panneaux (mode test, erreur) ---------- */
.panneau{ position:fixed; inset:calc(env(safe-area-inset-top, 0px) + 64px) 12px auto; margin:0 auto; max-width:560px;
  max-height:calc(100% - 160px); overflow:auto; padding:14px 16px; border-radius:14px;
  background:rgba(11,20,38,.94); border:1px solid var(--bord); box-shadow:0 12px 30px rgba(0,0,0,.45); -webkit-user-select:text; user-select:text; }
.panneau h2{ margin:0 0 8px; font-size:1.1rem; }
.panneau ul{ list-style:none; margin:0 0 10px; padding:0; }
.panneau li{ display:flex; gap:8px; padding:5px 0; border-bottom:1px solid var(--bord); font-size:.9rem; line-height:1.3; }
.panneau li:last-child{ border-bottom:0; }
.panneau .etat{ flex:none; width:58px; font-weight:800; }
.panneau .etat.ok{ color:#6BD68F; } .panneau .etat.ko{ color:#FF6B7A; }
.panneau small{ display:block; color:var(--doux); }
.panneau .resume{ font-weight:800; margin:4px 0 10px; }
@media (max-width:480px){
  .stat{ min-width:auto; flex:1 1 auto; padding:6px 8px; } .stat b{ font-size:.95rem; white-space:nowrap; }
  .titre b{ font-size:1.1rem; }
  .outils .bouton{ font-size:.8rem; padding:7px 8px; }
  .bas .rang{ gap:4px; }
  .stat{ padding:5px 4px; } .stat > span{ font-size:.58rem; letter-spacing:.02em; } .stat b{ font-size:.8rem; }
  .stat .obj{ display:none; }
  .haut .bouton{ padding:8px 9px; font-size:.82rem; }
  .vitrine .rang .bouton{ font-size:.8rem; padding:7px 8px; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Vue 3D de la station"></canvas>

<header class="haut">
  <a class="home" href="../../index.html">DesDés</a>
  <div class="titre"><b id="titre">Nivoculteur</b><span id="sousTitre">Découverte du terrain</span></div>
  <button class="bouton" id="ouvrirMenu" type="button">Menu</button>
  <a class="bouton" id="lienModeles" href="index.html?modeles" hidden>Modèles 3D</a>
  <a class="bouton" id="lienTerrain" href="index.html" hidden>Terrain</a>
  <button class="bouton" id="recentrer" type="button">Recentrer</button>
</header>

<div id="messages" aria-live="polite"></div>

<footer class="bas jeu" id="barreJeu">
  <div class="consigne" id="consigne" hidden></div>
  <div class="devis" id="devis" hidden></div>
  <div class="rang">
    <div class="stat"><span>Budget</span><b id="hudBudget">—</b></div>
    <div class="stat"><span>Nuit</span><b id="hudNuit">—</b></div>
    <div class="stat"><span id="hudNeigeTitre">Neige piste</span><b id="hudNeige">—</b></div>
    <div class="stat"><span>Vent</span><b><svg id="flecheVent" class="fleche" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1 L16.5 11 H11.5 V19 H8.5 V11 H3.5 Z" fill="currentColor"/></svg> <em id="hudVentForce">—</em></b></div>
    <div class="stat"><span>Retenue</span><b id="hudRetenue">—</b></div>
  </div>
  <div class="rang choix" id="choixEnneigeur" hidden>
    <label>Enneigeur <select id="choixModele"></select></label>
    <label>Support <select id="choixSupport"></select></label>
    <span id="choixPrix"></span>
  </div>
  <div class="rang outils">
    <button class="bouton outil construction" type="button" data-outil="regard">+ Regard</button>
    <button class="bouton outil construction" type="button" data-outil="eau">Eau</button>
    <button class="bouton outil construction" type="button" data-outil="cable">Électricité</button>
    <button class="bouton outil construction" type="button" data-outil="air" hidden>Air</button>
    <button class="bouton construction" type="button" id="sousSol">Vue sous-sol</button>
    <button class="bouton construction" type="button" id="annuler" disabled>Annuler</button>
    <button class="bouton construction" type="button" id="effacer">Tout effacer</button>
    <button class="bouton" type="button" id="ouvrirPoste">Poste de travail</button>
    <button class="bouton nuit construction" type="button" id="lancerNuit">Lancer la nuit</button>
    <button class="bouton" type="button" id="accelerer" hidden>Accélérer ×3</button>
  </div>
</footer>

<footer class="bas vitrine" id="barreVitrine" hidden>
  <div class="rang options" id="vitrineOptions"></div>
  <div class="rang" id="vitrineModeles"></div>
</footer>

<section class="poste" id="poste" hidden aria-label="Poste de travail"></section>
<section class="poste menu" id="menu" hidden aria-label="Menu des niveaux"></section>
<section class="panneau" id="panneauTests" hidden></section>
<section class="panneau" id="panneauErreur" hidden></section>

<script src="three.min.js"></script>

<script src="js/config.js"></script>
<script src="js/niveaux.js"></script>
<script src="js/simulation.js"></script>
<script src="js/modeles.js"></script>
<script src="js/effets.js"></script>
<script src="js/interface.js"></script>
