<!DOCTYPE html>
<html lang="fr">
<head>

<style>
:root{
  --nuit:#0B1426; --nuit-2:#13213D; --texte:#EAF2FF; --doux:rgba(234,242,255,.68);
  --verre:rgba(11,20,38,.72); --bord:rgba(234,242,255,.16);
  --info:#2F6FDE; --ok:#2E9E5B; --attention:#E58A1F; --alarme:#D7263D; --or:#E9B949;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; background:var(--nuit); color:var(--texte);
  font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select:none; user-select:none; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; }
button:focus-visible, a:focus-visible{ outline:3px solid var(--or); outline-offset:2px; }
[hidden]{ display:none !important; }

#scene{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

/* ---------- Bandeau du haut ---------- */
.haut{ position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 12px) 18px calc(env(safe-area-inset-left, 0px) + 12px);
  background:linear-gradient(rgba(5,11,28,.85), rgba(5,11,28,0)); pointer-events:none; }
.haut > *{ pointer-events:auto; }
.home{ display:inline-flex; align-items:center; gap:6px; color:var(--doux); text-decoration:none; font-weight:600; font-size:.95rem;
  padding:8px 10px; border-radius:10px; background:var(--verre); border:1px solid var(--bord); white-space:nowrap; }
.home::before{ content:"←"; }
.home:hover{ color:var(--texte); }
.titre{ flex:1; min-width:0; line-height:1.1; }
.titre b{ display:block; font-size:1.25rem; font-weight:800; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.titre span{ display:block; font-size:.82rem; color:var(--doux); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bouton{ padding:9px 12px; border-radius:10px; background:var(--verre); border:1px solid var(--bord); font-weight:600; font-size:.9rem; white-space:nowrap; text-decoration:none; color:var(--texte); }
.bouton:hover{ background:rgba(47,111,222,.35); }
.bouton.actif{ background:#2F6FDE; border-color:#2F6FDE; }

/* ---------- Messages (bleu = info, vert = OK, orange = attention, rouge = alarme) ---------- */
#messages{ position:fixed; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top, 0px) + 66px);
  width:min(520px, calc(100% - 24px)); display:flex; flex-direction:column; gap:6px; pointer-events:none; }
.message{ padding:9px 12px; border-radius:10px; font-size:.92rem; line-height:1.3; background:var(--verre);
  border-left:5px solid var(--info); box-shadow:0 6px 18px rgba(0,0,0,.35); transition:opacity .4s ease, transform .4s ease; }
.message.ok{ border-left-color:var(--ok); }
.message.attention{ border-left-color:var(--attention); }
.message.alarme{ border-left-color:var(--alarme); background:rgba(80,10,20,.82); }
.message.sortie{ opacity:0; transform:translateY(-6px); }

/* ---------- Barre du bas ---------- */
.bas{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
  padding:18px calc(env(safe-area-inset-right, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 10px) calc(env(safe-area-inset-left, 0px) + 12px);
  background:linear-gradient(rgba(5,11,28,0), rgba(5,11,28,.85)); pointer-events:none; }
.bas > *{ pointer-events:auto; }
.stat{ min-width:96px; padding:7px 12px; border-radius:12px; background:var(--verre); border:1px solid var(--bord); text-align:center; }
.stat span{ display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--doux); }
.stat b{ display:block; font-size:1.05rem; font-variant-numeric:tabular-nums; }
/* ---------- Construction : consigne, devis, outils ---------- */
.bas.jeu{ flex-direction:column; align-items:center; gap:6px; }
.bas .rang{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:760px; }
.consigne{ max-width:min(560px, 100%); padding:7px 12px; border-radius:10px; font-size:.88rem; line-height:1.3; text-align:center;
  background:var(--verre); border:1px solid var(--bord); color:var(--texte); }
.devis{ width:min(520px, 100%); padding:10px 12px; border-radius:12px; background:rgba(11,20,38,.94); border:1px solid var(--or); box-shadow:0 8px 22px rgba(0,0,0,.4); }
.devis .tete{ display:flex; justify-content:space-between; gap:10px; font-weight:800; font-size:1rem; }
.devis ul{ margin:6px 0 8px; padding-left:18px; font-size:.86rem; line-height:1.35; color:var(--doux); }
.devis .refus{ color:#FF8A96; font-weight:700; font-size:.88rem; margin:0 0 8px; }
.devis .actions{ display:flex; gap:8px; justify-content:flex-end; }
.devis .actions .bouton:first-child{ background:var(--ok); border-color:var(--ok); }
.devis .actions .bouton:disabled{ opacity:.45; cursor:default; }
.outils .bouton{ font-size:.86rem; padding:8px 11px; }
.outils .bouton:disabled{ opacity:.4; cursor:default; }
.outil.actif[data-outil="regard"]{ background:#E58A1F; border-color:#E58A1F; }
.outil.actif[data-outil="eau"]{ background:#2F6FDE; border-color:#2F6FDE; }
.outil.actif[data-outil="cable"]{ background:#E9B949; border-color:#E9B949; color:#1C1F25; }
#sousSol.actif{ background:#5C6B86; border-color:#9FB0CF; }

/* ---------- Vitrine des modèles ---------- */
.vitrine{ flex-direction:column; align-items:center; gap:8px; }
.vitrine .rang{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:760px; }
.vitrine .rang .bouton{ font-size:.85rem; padding:8px 10px; }
.vitrine .options .bouton{ background:rgba(233,185,73,.16); border-color:rgba(233,185,73,.45); }

/* ---------- Panneaux (mode test, erreur) ---------- */
.panneau{ position:fixed; inset:calc(env(safe-area-inset-top, 0px) + 64px) 12px auto; margin:0 auto; max-width:560px;
  max-height:calc(100% - 160px); overflow:auto; padding:14px 16px; border-radius:14px;
  background:rgba(11,20,38,.94); border:1px solid var(--bord); box-shadow:0 12px 30px rgba(0,0,0,.45); -webkit-user-select:text; user-select:text; }
.panneau h2{ margin:0 0 8px; font-size:1.1rem; }
.panneau ul{ list-style:none; margin:0 0 10px; padding:0; }
.panneau li{ display:flex; gap:8px; padding:5px 0; border-bottom:1px solid var(--bord); font-size:.9rem; line-height:1.3; }
.panneau li:last-child{ border-bottom:0; }
.panneau .etat{ flex:none; width:58px; font-weight:800; }
.panneau .etat.ok{ color:#6BD68F; } .panneau .etat.ko{ color:#FF6B7A; }
.panneau small{ display:block; color:var(--doux); }
.panneau .resume{ font-weight:800; margin:4px 0 10px; }
@media (max-width:480px){
  .stat{ min-width:0; flex:1; padding:6px 8px; } .stat b{ font-size:.95rem; white-space:nowrap; }
  .titre b{ font-size:1.1rem; }
  .outils .bouton{ font-size:.8rem; padding:7px 8px; }
  .haut .bouton{ padding:8px 9px; font-size:.82rem; }
  .vitrine .rang .bouton{ font-size:.8rem; padding:7px 8px; }
}
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

<script>
'use strict';

/* =====================================================================================
   1. CONFIG — tous les chiffres réglables du jeu
   Les valeurs sont provisoires : à remplacer par celles d'une vraie installation.
   ===================================================================================== */
const CONFIG = {
  // --- Coûts de construction, en euros ---
  couts: {
    trancheeEau: 750,       // € par mètre de tranchée avec une conduite d'eau seule
    trancheeCable: 550,     // € par mètre de tranchée avec un câble électrique seul
    trancheeCommune: 900,   // € par mètre de tranchée commune eau + câble (on ne creuse qu'une fois)
    regardCanon: 8000       // € pour un regard équipé de son canon
  },

  // --- Argent gagné ---
  gains: {
    parM3Piste: 20          // € par m³ de neige tombée SUR la piste (la neige hors piste ne rapporte rien)
  },

  // --- Pression d'eau au regard ---
  // P_regard = P_pompes − pertes dues à la longueur − pertes dues à la montée − pertes dues au débit demandé
  pression: {
    pompes: 52,             // bar fournis par les pompes en marche, à la sortie de la salle de pompage
                            // (52 bar : environ 51 bar en bas de la piste et 33 bar tout en haut)
    perteLongueur: 0.6,     // bar perdus par tranche de 100 m de conduite (perte de charge)
    perteDenivele: 1.2,     // bar perdus par tranche de 10 m de montée (dans la réalité, environ 1 bar pour 10 m)
    perteDebit: 0.05,       // bar perdus par m³/h d'eau demandé par l'ensemble des canons ouverts
    // Zones de fonctionnement (en bar) :
    //   moins de 22 : pas de production · 22 à 30 : production faible · 30 à 50 : production correcte
    //   50 à 55 : pression haute (on produit, mais à surveiller) · plus de 55 : surpression (alarme)
    zones: { arret: 22, faible: 30, correcte: 50, surpression: 55 },
    cadranMax: 80           // bar : graduation maximale des manomètres
  },

  // --- Production de neige ---
  production: {
    correcte: 10,           // m³ de neige par seconde de jeu, en zone correcte (et haute)
    faible: 4               // m³ de neige par seconde de jeu, en zone faible
  },

  // --- Construction du réseau ---
  construction: {
    ecartRegards: 12,       // m : distance minimale entre deux regards
    profondeur: 1.5         // m : profondeur des conduites et des câbles (affichage en vue sous-sol)
  },

  // --- Nuit ---
  nuit: {
    duree: 40               // durée d'une nuit, en secondes de jeu
  },

  // --- Caméra ---
  camera: {
    distanceDepart: 390,    // m entre la caméra et le point regardé au lancement
    distanceMin: 20,        // zoom le plus proche (m)
    distanceMax: 750,       // zoom le plus lointain (m)
    inclinaisonDepart: 16,  // degrés au-dessus de l'horizon au lancement
    inclinaisonMin: 4,      // degrés
    inclinaisonMax: 84,     // degrés
    sensibiliteRotation: 0.006,
    sensibiliteDeplacement: 0.0017,
    douceur: 12             // plus c'est grand, plus la caméra suit vite le doigt
  },

  // --- Graphismes (baisser ces nombres si le téléphone rame) ---
  graphismes: {
    ombres: true,           // ombres des sapins sous la lune
    tailleOmbres: 2048,     // précision des ombres (1024 = plus rapide)
    sapins: 750,
    rochers: 80,
    etoiles: 900,
    pixelRatioMax: 2        // limite la finesse d'affichage sur les écrans très denses
  }
};

/* =====================================================================================
   2. LEVELS — description des niveaux
   Coordonnées en mètres. x : de gauche à droite. z : du haut de la pente (négatif) vers le bas (positif).
   Pour ajouter un niveau : copier un bloc et changer les valeurs, sans toucher au reste du code.
   ===================================================================================== */

const PISTE_CLARINES = {
  nom: 'Les Clarines',
  couleur: 'bleue',         // verte, bleue, rouge ou noire (couleur des jalons)
  largeur: 40,              // m
  points: [[-10, -250], [25, -180], [40, -110], [5, -40], [-40, 30], [-35, 100], [0, 170], [10, 250]]
};

// Retenue d'eau (lac artificiel) : un plateau creusé d'une cuvette, entouré d'une digue
const RETENUE_COMBE = {
  nom: 'Retenue des Clarines',
  x: -112, z: 146,
  rayon: 39,                // m : plateau autour du lac (digue comprise)
  talus: 26,                // m : raccord en pente douce avec le terrain naturel
  cuvette: { rayon: 32, profondeur: 7, digue: 1.2 },   // rayon du lac plein, profondeur au centre, hauteur de la digue (m)
  niveau: 0.85              // remplissage au départ (0 = vide, 1 = pleine)
};

// Salle de pompage, posée sur un replat (terrain aplani)
const POMPAGE_COMBE = { nom: 'Salle de pompage', x: -98, z: 208, rayon: 12, talus: 14, rotation: 0,
  sortie: { x: -90, z: 206.5 } };     // là où la conduite de départ sort du bâtiment

// Départs électriques : près des bâtiments (salle de pompage, gares du télésiège)
const DEPARTS_COMBE = [
  { nom: 'Départ élec · pompage', x: -80, z: 214 },
  { nom: 'Départ élec · gare aval', x: 95, z: 232 },
  { nom: 'Départ élec · gare amont', x: 83, z: -236 }
];

// Remontée mécanique (décor : elle ne tourne pas la nuit)
const TELESIEGE_CLARINES = {
  nom: 'Télésiège des Clarines',
  aval: { x: 112, z: 220 },   // gare de départ, en bas
  amont: { x: 98, z: -226 },  // gare d'arrivée, en haut
  pylones: 8,
  hauteur: 10,                // m : hauteur des pylônes
  ecart: 5,                   // m entre le câble montant et le câble descendant
  espacementSieges: 22        // m entre deux sièges
};

// Terrain partagé par les premiers niveaux : une combe de 300 m × 500 m et 150 m de dénivelé
const TERRAIN_COMBE = {
  largeur: 300,             // m, zone de jeu de gauche à droite
  longueur: 500,            // m, zone de jeu du bas au haut de la pente (à plat)
  altBas: 1650,             // altitude du bas de la zone de jeu (m)
  denivele: 150,            // m entre le bas et le haut
  bords: 24,                // m : les côtés de la combe remontent (pente en cuvette)
  rugosite: 1.6,            // m : petites bosses de la neige
  bosses: [                 // grosses bosses (h positif) ou creux (h négatif), r = rayon (m)
    { x: -85, z: -120, r: 45, h: 10 },
    { x: 95,  z: 30,   r: 55, h: 12 },
    { x: -30, z: 120,  r: 40, h: -6 },
    { x: 100, z: -185, r: 60, h: 14 },
    { x: -110, z: 60,  r: 35, h: 7 }
  ],
  // Montagnes du décor autour de la zone de jeu (hors jeu)
  montagnes: { hauteur: 520, distance: 380, recul: 60 },
  // Replats : endroits aplanis pour les bâtiments et la retenue
  replats: [
    RETENUE_COMBE,
    POMPAGE_COMBE,
    { ...TELESIEGE_CLARINES.aval, rayon: 10, talus: 12 },
    { ...TELESIEGE_CLARINES.amont, rayon: 10, talus: 12 }
  ],
  graine: 7,                // change la forme des petites bosses et la place des sapins
  maille: 6,                // m : taille des facettes du terrain en 3D près de la zone de jeu
  marge: 60,                // m de terrain fin (petites facettes) autour de la zone de jeu
  etendue: 1600             // m : le décor s'étend jusque-là dans chaque direction
};

const LEVELS = [
  {
    id: 'pompage',
    nom: 'La salle de pompage',
    resume: 'Démarrer les pompes, ouvrir la vanne principale et garder la pression dans la zone verte.',
    terrain: TERRAIN_COMBE,
    pistes: [PISTE_CLARINES],
    pompage: POMPAGE_COMBE,
    retenue: RETENUE_COMBE,
    remontees: [TELESIEGE_CLARINES],
    departsElec: DEPARTS_COMBE,
    budget: 0,
    objectif: { type: 'production', pourcent: 100 }
  },
  {
    id: 'reseau',
    nom: 'Construire le réseau',
    resume: 'Poser les regards et les canons, tracer l\'eau et l\'électricité, puis produire de la neige sur la piste.',
    terrain: TERRAIN_COMBE,
    pistes: [PISTE_CLARINES],
    pompage: POMPAGE_COMBE,
    retenue: RETENUE_COMBE,
    remontees: [TELESIEGE_CLARINES],
    departsElec: DEPARTS_COMBE,
    budget: 650000,
    objectif: { type: 'neigePiste', m3: 3000 }
  }
];

/* =====================================================================================
   3. SIMULATION — logique pure, sans Three.js
   Tout ce qui est ici doit pouvoir fonctionner seul (même sans affichage 3D).
   ===================================================================================== */

const borne = (v, a, b) => Math.max(a, Math.min(b, v));
const lisse = t => { t = borne(t, 0, 1); return t * t * (3 - 2 * t); };

// --- Hasard reproductible : la même graine donne toujours la même suite de nombres ---
function alea(graine){
  let a = graine >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Petites bosses régulières (bruit) entre −1 et 1
function hachage(i, j, g){
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(g, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function bruit(x, z, g){
  const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j;
  const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
  const a = hachage(i, j, g), b = hachage(i + 1, j, g), c = hachage(i, j + 1, g), d = hachage(i + 1, j + 1, g);
  return (a + (b - a) * sx + (c - a) * sz + (a - b - c + d) * sx * sz) * 2 - 1;
}

// --- Terrain ---
function dansZoneJeu(t, x, z){ return Math.abs(x) <= t.largeur / 2 && Math.abs(z) <= t.longueur / 2; }
// Distance (m) entre un point et la zone de jeu (0 si on est dedans)
function distanceZoneJeu(t, x, z){
  return Math.hypot(Math.max(0, Math.abs(x) - t.largeur / 2), Math.max(0, Math.abs(z) - t.longueur / 2));
}

// Forme naturelle de la montagne, sans les replats ni les petites bosses
function altitudeNaturelle(t, x, z){
  const u = borne((t.longueur / 2 - z) / t.longueur, -0.9, 1.8);   // 0 en bas de la pente, 1 en haut
  let h = t.altBas + t.denivele * (0.85 * u + 0.15 * u * u);
  const bx = borne(x / (t.largeur / 2), -1.7, 1.7);
  h += t.bords * bx * bx;                                           // les côtés remontent
  for(const b of t.bosses) h += b.h * Math.exp(-((x - b.x) ** 2 + (z - b.z) ** 2) / (b.r * b.r));
  // Montagnes du décor : elles montent dès qu'on sort de la zone de jeu (moins vers la vallée, en bas)
  const m = t.montagnes;
  if(m){
    const d = distanceZoneJeu(t, x, z) - m.recul;
    if(d > 0){
      const vallee = lisse((z - t.longueur / 2) / 300) * lisse(1 - (Math.abs(x) - t.largeur / 2) / 450);
      const crete = 1 - Math.abs(bruit(x / 240, z / 240, t.graine + 20));
      const pics = 0.5 + 0.5 * bruit(x / 130, z / 130, t.graine + 21);
      const f = 1 - Math.exp(-d / m.distance);
      h += m.hauteur * f * (0.35 + 0.45 * crete + 0.3 * pics) * (1 - 0.8 * vallee);
      h += Math.min(1, d / 120) * 9 * bruit(x / 45, z / 45, t.graine + 22);   // rochers et ravines
    }
  }
  return h;
}

// Hauteur d'un replat : celle du terrain naturel en son centre (mémorisée)
const _cotesReplats = new WeakMap();
function coteReplat(t, r){
  if(!_cotesReplats.has(r)) _cotesReplats.set(r, altitudeNaturelle(t, r.x, r.z) + (r.surelever || 0));
  return _cotesReplats.get(r);
}

// Altitude réelle (m) en un point (x, z). Si on donne les pistes, la neige y est damée (presque plus de bosses).
function altitude(t, x, z, pistes = null){
  let h = altitudeNaturelle(t, x, z);
  let rug = t.rugosite;
  if(pistes){ const pp = pistePlusProche(pistes, x, z); if(pp) rug *= Math.min(1, 0.15 + pp.auBord / 10); }
  // Replats : terrain aplani (bâtiments, gares, retenue), raccordé par un talus
  let plat = 0;
  for(const r of t.replats || []){
    const d = Math.hypot(x - r.x, z - r.z);
    const w = d <= r.rayon ? 1 : 1 - lisse((d - r.rayon) / r.talus);
    if(w <= 0) continue;
    h += (coteReplat(t, r) - h) * w;
    plat = Math.max(plat, w);
    const c = r.cuvette;
    if(c && d < c.rayon) h -= c.profondeur * (1 - (d / c.rayon) ** 2);                          // le lac
    else if(c && d < r.rayon) h += c.digue * Math.sin(Math.PI * (d - c.rayon) / (r.rayon - c.rayon));   // la digue
  }
  rug *= (1 - plat) * (1 - lisse((distanceZoneJeu(t, x, z) - 30) / 25));   // plus de petites bosses hors du domaine
  return h + rug * (bruit(x / 22, z / 22, t.graine) + 0.5 * bruit(x / 9, z / 9, t.graine + 1));
}

// Eau de la retenue selon son remplissage f (0 à 1) : altitude de la surface et rayon du lac
function eauRetenue(t, retenue, f){
  const c = retenue.cuvette, plein = coteReplat(t, retenue);
  f = borne(f, 0, 1);
  return { cote: plein - c.profondeur * (1 - f), rayon: c.rayon * Math.sqrt(f) };
}

// --- Lignes et pistes ---
// Courbe douce qui passe par tous les points (Catmull-Rom), avec un point tous les « pas » mètres environ
function courbe(points, pas){
  const out = [], n = points.length;
  for(let i = 0; i < n - 1; i++){
    const p0 = points[Math.max(0, i - 1)], p1 = points[i], p2 = points[i + 1], p3 = points[Math.min(n - 1, i + 2)];
    const k = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / pas));
    for(let s = 0; s < k; s++){
      const t = s / k, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(c => 0.5 * (2 * p1[c] + (-p0[c] + p2[c]) * t + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * t2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * t3)));
    }
  }
  out.push(points[n - 1].slice());
  return out;
}
function longueurLigne(pts){
  let l = 0;
  for(let i = 1; i < pts.length; i++) l += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return l;
}
function distanceSegment(x, z, a, b){
  const dx = b[0] - a[0], dz = b[1] - a[1], l2 = dx * dx + dz * dz;
  const t = l2 ? Math.max(0, Math.min(1, ((x - a[0]) * dx + (z - a[1]) * dz) / l2)) : 0;
  return Math.hypot(x - a[0] - t * dx, z - a[1] - t * dz);
}
const _courbesPistes = new WeakMap();
function courbePiste(piste){
  if(!_courbesPistes.has(piste)) _courbesPistes.set(piste, courbe(piste.points, 4));
  return _courbesPistes.get(piste);
}
function distancePiste(piste, x, z){
  const c = courbePiste(piste);
  let d = Infinity;
  for(let i = 1; i < c.length; i++) d = Math.min(d, distanceSegment(x, z, c[i - 1], c[i]));
  return d;
}
function surPiste(piste, x, z){ return distancePiste(piste, x, z) <= piste.largeur / 2; }
// La piste la plus proche d'un point, et la distance au bord (0 si on est dessus)
function pistePlusProche(pistes, x, z){
  let meilleure = null, dMin = Infinity;
  for(const p of pistes){ const d = distancePiste(p, x, z); if(d < dMin){ dMin = d; meilleure = p; } }
  return meilleure && { piste: meilleure, dessus: dMin <= meilleure.largeur / 2, auBord: Math.max(0, dMin - meilleure.largeur / 2) };
}

// --- Remontées mécaniques ---
function longueurTelesiege(ts){ return Math.hypot(ts.amont.x - ts.aval.x, ts.amont.z - ts.aval.z); }
// Pylônes répartis régulièrement entre les deux gares
function pylonesTelesiege(ts){
  const out = [];
  for(let i = 1; i <= ts.pylones; i++){
    const f = i / (ts.pylones + 1);
    out.push({ x: ts.aval.x + (ts.amont.x - ts.aval.x) * f, z: ts.aval.z + (ts.amont.z - ts.aval.z) * f });
  }
  return out;
}
function distanceTelesiege(ts, x, z){ return distanceSegment(x, z, [ts.aval.x, ts.aval.z], [ts.amont.x, ts.amont.z]); }

// --- Pression d'eau au regard (bar) ---
// longueur : m de conduite depuis le pompage · denivele : m de montée (négatif si le regard est plus bas)
// debit : m³/h demandés par l'ensemble des canons ouverts
function pressionRegard({ pPompes, longueur, denivele, debit }, cfg = CONFIG.pression){
  return pPompes - longueur / 100 * cfg.perteLongueur - denivele / 10 * cfg.perteDenivele - debit * cfg.perteDebit;
}
function zonePression(p, cfg = CONFIG.pression){
  const z = cfg.zones;
  if(p < z.arret) return 'arret';
  if(p < z.faible) return 'faible';
  if(p <= z.correcte) return 'correcte';
  if(p <= z.surpression) return 'haute';
  return 'surpression';
}
// m³ de neige produits par seconde de jeu selon la pression
function productionCanon(p, cfg = CONFIG){
  const z = zonePression(p, cfg.pression);
  if(z === 'correcte' || z === 'haute') return cfg.production.correcte;
  if(z === 'faible') return cfg.production.faible;
  return 0;
}

// --- Coûts ---
// Prix d'une tranchée de « longueur » mètres, selon ce qu'on y met (eau, câble, ou les deux : tranchée commune)
function coutTranchee(longueur, { eau = false, cable = false } = {}, cfg = CONFIG.couts){
  const parMetre = eau && cable ? cfg.trancheeCommune : eau ? cfg.trancheeEau : cable ? cfg.trancheeCable : 0;
  return Math.round(longueur * parMetre);
}
function gainNeige(m3SurPiste, cfg = CONFIG.gains){ return Math.round(m3SurPiste * cfg.parM3Piste); }

// --- Réseau construit par le joueur ---
// Nœuds : la salle de pompage (source d'eau), les départs électriques (sources d'électricité) et les regards.
// Tranchées : entre deux nœuds, avec de l'eau, un câble, ou les deux (tranchée commune).
function creerReseau(niveau){
  const p = niveau.pompage;
  return {
    budget: niveau.budget,
    noeuds: [
      { id: 'pompage', type: 'pompage', nom: p.nom, x: p.sortie.x, z: p.sortie.z },
      ...niveau.departsElec.map((d, i) => ({ id: `elec${i + 1}`, type: 'elec', nom: d.nom, x: d.x, z: d.z }))
    ],
    tranchees: [],          // { a, b, eau, cable, longueur }
    historique: [],         // pour annuler : une entrée par achat, regroupées par « lot » (une action du joueur)
    numero: 0,              // numéro du dernier regard posé
    lot: 0
  };
}
const cleTranchee = (a, b) => a < b ? `${a}|${b}` : `${b}|${a}`;
function noeudReseau(res, id){ return res.noeuds.find(n => n.id === id); }
function trancheeEntre(res, a, b){ const k = cleTranchee(a, b); return res.tranchees.find(tr => cleTranchee(tr.a, tr.b) === k); }

// Longueur d'une tranchée en ligne droite, en suivant le relief (m)
function longueurTranchee(t, a, b){
  const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.z - a.z) / 4));
  let l = 0, prec = null;
  for(let i = 0; i <= n; i++){
    const x = a.x + (b.x - a.x) * i / n, z = a.z + (b.z - a.z) * i / n, y = altitude(t, x, z);
    if(prec) l += Math.hypot(x - prec[0], y - prec[1], z - prec[2]);
    prec = [x, y, z];
  }
  return l;
}
// Nœuds alimentés : reliés à une source (salle de pompage pour 'eau', départs électriques pour 'cable')
function alimentes(res, quoi){
  const ok = new Set(res.noeuds.filter(n => n.type === (quoi === 'eau' ? 'pompage' : 'elec')).map(n => n.id));
  const pile = [...ok];
  while(pile.length){
    const id = pile.pop();
    for(const tr of res.tranchees){
      if(!tr[quoi]) continue;
      const autre = tr.a === id ? tr.b : tr.b === id ? tr.a : null;
      if(autre && !ok.has(autre)){ ok.add(autre); pile.push(autre); }
    }
  }
  return ok;
}
// Longueur de conduite depuis la salle de pompage (par le chemin le plus court) pour chaque nœud alimenté en eau
function longueursEau(res){
  const dist = new Map([['pompage', 0]]), faits = new Set();
  for(;;){
    let id = null, d = Infinity;
    for(const [k, v] of dist) if(!faits.has(k) && v < d){ id = k; d = v; }
    if(id === null) return dist;
    faits.add(id);
    for(const tr of res.tranchees){
      if(!tr.eau) continue;
      const autre = tr.a === id ? tr.b : tr.b === id ? tr.a : null;
      if(autre && d + tr.longueur < (dist.has(autre) ? dist.get(autre) : Infinity)) dist.set(autre, d + tr.longueur);
    }
  }
}
// État d'un regard : eau, électricité, pression prévue (pompes en marche, aucun canon ouvert)
function etatRegard(niveau, res, id){
  const n = noeudReseau(res, id), t = niveau.terrain, pomp = noeudReseau(res, 'pompage');
  const eau = alimentes(res, 'eau').has(id), elec = alimentes(res, 'cable').has(id);
  let pression = null, zone = null;
  if(eau){
    pression = pressionRegard({ pPompes: CONFIG.pression.pompes, longueur: longueursEau(res).get(id),
      denivele: altitude(t, n.x, n.z) - altitude(t, pomp.x, pomp.z), debit: 0 });
    zone = zonePression(pression);
  }
  const manque = !eau && !elec ? 'l\'eau et l\'électricité' : !eau ? 'l\'eau' : !elec ? 'l\'électricité' : null;
  return { eau, elec, pression, zone, manque, pret: eau && elec };
}
// Peut-on poser un regard ici ? (null = oui, sinon la raison)
function refusRegard(niveau, res, x, z){
  const t = niveau.terrain, ecart = CONFIG.construction.ecartRegards, R = niveau.retenue;
  if(!dansZoneJeu(t, x, z)) return 'Ce point est en dehors du domaine skiable.';
  if(R && Math.hypot(x - R.x, z - R.z) < R.cuvette.rayon + 4) return 'Impossible de poser un regard dans la retenue.';
  for(const r of t.replats || []) if(r !== R && Math.hypot(x - r.x, z - r.z) < r.rayon) return 'Trop près d\'un bâtiment.';
  for(const ts of niveau.remontees || []) if(distanceTelesiege(ts, x, z) < 4) return 'Trop près de la ligne du télésiège.';
  for(const n of res.noeuds){
    const d = Math.hypot(x - n.x, z - n.z);
    if(n.type === 'regard' && d < ecart) return `Trop près d'un autre regard (il faut au moins ${ecart} m).`;
    if(n.type !== 'regard' && d < 6) return 'Trop près d\'une installation.';
  }
  return null;
}
function poserRegard(niveau, res, x, z, lot = ++res.lot){
  const refus = refusRegard(niveau, res, x, z);
  if(refus) return { ok: false, raison: refus };
  const cout = CONFIG.couts.regardCanon;
  if(res.budget < cout) return { ok: false, raison: 'Budget insuffisant.' };
  const id = `R${++res.numero}`;
  res.noeuds.push({ id, type: 'regard', nom: `Regard ${res.numero}`, x, z });
  res.budget -= cout;
  res.historique.push({ lot, type: 'regard', id, cout });
  return { ok: true, id, cout };
}
// Devis d'une tranchée de A vers B, pour l'eau ('eau') ou l'électricité ('cable')
function devisTranchee(niveau, res, idA, idB, quoi){
  const A = noeudReseau(res, idA), B = noeudReseau(res, idB), c = CONFIG.couts, R = niveau.retenue;
  const refus = raison => ({ ok: false, raison });
  if(!A || !B || idA === idB) return refus('Choisissez deux points différents.');
  if(B.type !== 'regard') return refus('L\'arrivée doit être un regard.');
  if(quoi === 'eau' && A.type === 'elec') return refus('L\'eau part de la salle de pompage ou d\'un regard.');
  if(quoi === 'cable' && A.type === 'pompage') return refus('Le câble part d\'un départ électrique ou d\'un regard.');
  if(!alimentes(res, quoi).has(idA)) return refus(`${A.nom} n'est pas encore alimenté en ${quoi === 'eau' ? 'eau' : 'électricité'}.`);
  if(R && distanceSegment(R.x, R.z, [A.x, A.z], [B.x, B.z]) < R.cuvette.rayon + 2) return refus('La tranchée ne peut pas traverser la retenue.');
  const existe = trancheeEntre(res, idA, idB);
  if(existe && existe[quoi]) return refus(`Ces deux points sont déjà reliés pour ${quoi === 'eau' ? 'l\'eau' : 'l\'électricité'}.`);
  const longueur = existe ? existe.longueur : longueurTranchee(niveau.terrain, A, B);
  const commune = !!(existe && existe[quoi === 'eau' ? 'cable' : 'eau']);
  // Tranchée commune : la tranchée est déjà creusée, on ne paie que la différence
  const parMetre = commune ? c.trancheeCommune - (quoi === 'eau' ? c.trancheeCable : c.trancheeEau) : (quoi === 'eau' ? c.trancheeEau : c.trancheeCable);
  const cout = Math.round(longueur * parMetre);
  const assez = res.budget >= cout;
  return { ok: assez, raison: assez ? null : 'Budget insuffisant.', longueur, cout, commune, parMetre };
}
function ajouterTranchee(niveau, res, idA, idB, quoi, lot = ++res.lot){
  const d = devisTranchee(niveau, res, idA, idB, quoi);
  if(!d.ok) return d;
  let tr = trancheeEntre(res, idA, idB);
  const nouvelle = !tr;
  if(nouvelle){ tr = { a: idA, b: idB, eau: false, cable: false, longueur: d.longueur }; res.tranchees.push(tr); }
  tr[quoi] = true;
  res.budget -= d.cout;
  res.historique.push({ lot, type: 'tranchee', cle: cleTranchee(idA, idB), quoi, nouvelle, cout: d.cout });
  return d;
}
// Annule la dernière action du joueur : tout ce qu'elle a acheté est remboursé
function annulerAction(res){
  if(!res.historique.length) return { ok: false, rembourse: 0 };
  const lot = res.historique[res.historique.length - 1].lot;
  let rembourse = 0;
  while(res.historique.length && res.historique[res.historique.length - 1].lot === lot){
    const h = res.historique.pop();
    rembourse += h.cout;
    if(h.type === 'regard'){
      res.noeuds = res.noeuds.filter(n => n.id !== h.id);
      if(h.id === `R${res.numero}`) res.numero--;
    } else {
      const tr = res.tranchees.find(x => cleTranchee(x.a, x.b) === h.cle);
      if(h.nouvelle) res.tranchees = res.tranchees.filter(x => x !== tr); else tr[h.quoi] = false;
    }
  }
  res.budget += rembourse;
  return { ok: true, rembourse };
}
// Direction (degrés) qui fait souffler un canon vers la piste la plus proche ; vers le bas de la pente s'il est dessus
function directionVersPiste(pistes, x, z){
  let best = null, d = Infinity;
  for(const p of pistes) for(const q of courbePiste(p)){ const e = Math.hypot(q[0] - x, q[1] - z); if(e < d){ d = e; best = q; } }
  if(!best || d < 8) return 0;
  return Math.round(Math.atan2(best[0] - x, best[1] - z) * 180 / Math.PI);
}

// --- Vérifications de la simulation (mode test : index.html?test) ---
function testsSimulation(){
  const res = [];
  const verifier = (nom, ok, detail = '') => res.push({ nom, ok: !!ok, detail });
  const proche = (a, b, e = 1e-6) => Math.abs(a - b) <= e;
  const m = v => `${Math.round(v)} m`;
  const cfgP = { pompes: 60, perteLongueur: 0.6, perteDenivele: 1.2, perteDebit: 0.05, zones: { arret: 22, faible: 30, correcte: 50, surpression: 55 } };

  const p1 = pressionRegard({ pPompes: 60, longueur: 500, denivele: 100, debit: 40 }, cfgP);
  verifier('Pression : 60 bar, 500 m de conduite, 100 m de montée, 40 m³/h → 43 bar', proche(p1, 43), `obtenu ${p1.toFixed(2)} bar`);
  const haut = pressionRegard({ pPompes: 60, longueur: 300, denivele: 120, debit: 0 }, cfgP);
  const bas = pressionRegard({ pPompes: 60, longueur: 300, denivele: 40, debit: 0 }, cfgP);
  verifier('Pression : un regard plus haut a moins de pression', haut < bas, `${haut.toFixed(1)} bar en haut, ${bas.toFixed(1)} bar plus bas`);
  const loin = pressionRegard({ pPompes: 60, longueur: 900, denivele: 50, debit: 0 }, cfgP);
  const pres = pressionRegard({ pPompes: 60, longueur: 200, denivele: 50, debit: 0 }, cfgP);
  verifier('Pression : un regard plus loin a moins de pression', loin < pres, `${loin.toFixed(1)} bar loin, ${pres.toFixed(1)} bar près`);
  const descente = pressionRegard({ pPompes: 60, longueur: 200, denivele: -30, debit: 0 }, cfgP);
  verifier('Pression : un regard plus bas que le pompage gagne de la pression', descente > 60, `${descente.toFixed(1)} bar`);
  const peu = pressionRegard({ pPompes: 60, longueur: 300, denivele: 50, debit: 10 }, cfgP);
  const beaucoup = pressionRegard({ pPompes: 60, longueur: 300, denivele: 50, debit: 120 }, cfgP);
  verifier('Pression : plus de canons ouverts = moins de pression', beaucoup < peu, `${beaucoup.toFixed(1)} bar contre ${peu.toFixed(1)} bar`);

  const zones = [[15, 'arret'], [25, 'faible'], [30, 'correcte'], [40, 'correcte'], [52, 'haute'], [60, 'surpression']];
  verifier('Zones de pression : 15 arrêt, 25 faible, 30 et 40 correcte, 52 haute, 60 surpression',
    zones.every(([p, z]) => zonePression(p, cfgP) === z), zones.map(([p]) => `${p} → ${zonePression(p, cfgP)}`).join(', '));
  const cfgProd = { pression: cfgP, production: { correcte: 10, faible: 4 } };
  verifier('Production : 10 m³/s en zone correcte, 4 en faible, 0 à l\'arrêt',
    productionCanon(40, cfgProd) === 10 && productionCanon(25, cfgProd) === 4 && productionCanon(15, cfgProd) === 0);

  const cfgC = { trancheeEau: 750, trancheeCable: 550, trancheeCommune: 900 };
  const eau = coutTranchee(100, { eau: true }, cfgC), cable = coutTranchee(100, { cable: true }, cfgC), commune = coutTranchee(100, { eau: true, cable: true }, cfgC);
  verifier('Tranchée de 100 m : eau 75 000 €, câble 55 000 €, commune 90 000 €', eau === 75000 && cable === 55000 && commune === 90000, `${eau} / ${cable} / ${commune}`);
  verifier('La tranchée commune coûte moins cher que deux tranchées séparées', commune < eau + cable, `${commune} € contre ${eau + cable} €`);
  verifier('Gain : 150 m³ sur la piste → 3 000 €', gainNeige(150, { parM3Piste: 20 }) === 3000);

  const t = TERRAIN_COMBE;
  const aBas = altitude(t, 0, t.longueur / 2), aHaut = altitude(t, 0, -t.longueur / 2);
  verifier('Terrain : le haut de la pente est plus haut que le bas', aHaut > aBas, `bas ${m(aBas)}, haut ${m(aHaut)}`);
  verifier('Terrain : environ 150 m de dénivelé', Math.abs(aHaut - aBas - t.denivele) < 15, m(aHaut - aBas));
  verifier('Terrain : la même position donne toujours la même altitude', altitude(t, 37.5, -12) === altitude(t, 37.5, -12));
  const cote = altitude(t, 140, 0), montagne = altitude(t, 700, 0);
  verifier('Décor : les montagnes montent autour de la zone de jeu', montagne > cote + 150, `bord ${m(cote)}, montagne ${m(montagne)}`);
  const vallee = altitude(t, 0, 750), flanc = altitude(t, 750, 750);
  verifier('Décor : en bas, la vallée reste dégagée', vallee < flanc - 150, `vallée ${m(vallee)}, flanc ${m(flanc)}`);

  const p = POMPAGE_COMBE, a1 = altitude(t, p.x - 6, p.z + 3), a2 = altitude(t, p.x + 6, p.z - 4);
  verifier('Replat : le sol est plat sous la salle de pompage', Math.abs(a1 - a2) < 0.05, `écart ${Math.abs(a1 - a2).toFixed(3)} m`);
  const R = RETENUE_COMBE, fond = altitude(t, R.x, R.z), bord = altitude(t, R.x + R.cuvette.rayon, R.z);
  verifier('Retenue : le fond du lac est plus bas que le bord', bord - fond > R.cuvette.profondeur * 0.9, `${(bord - fond).toFixed(1)} m de profondeur`);
  const plein = eauRetenue(t, R, 1), quart = eauRetenue(t, R, 0.25);

    proche(quart.rayon, R.cuvette.rayon / 2) && proche(plein.cote - quart.cote, R.cuvette.profondeur * 0.75), `rayon ${quart.rayon} m`);

  const piste = PISTE_CLARINES, [x0, z0] = piste.points[3];
  verifier('Piste : un point de la ligne du milieu est sur la piste', surPiste(piste, x0, z0));
  verifier('Piste : un point à 100 m est hors piste', !surPiste(piste, x0 + 100, z0));
  const lPiste = longueurLigne(courbePiste(piste));
  verifier('Piste : longueur raisonnable (entre 500 et 700 m)', lPiste > 500 && lPiste < 700, m(lPiste));
  verifier('Longueur d\'une ligne : 3-4-5 → 5 m', proche(longueurLigne([[0, 0], [3, 4]]), 5));

  const ts = TELESIEGE_CLARINES, pyl = pylonesTelesiege(ts), lt = longueurTelesiege(ts);
  const premier = Math.hypot(pyl[0].x - ts.aval.x, pyl[0].z - ts.aval.z);
  verifier('Télésiège : 8 pylônes régulièrement espacés', pyl.length === 8 && proche(premier, lt / 9, 1e-6), `${m(lt)} de ligne, un pylône tous les ${m(premier)}`);
  verifier('Télésiège : à l\'écart de la piste', pyl.every(q => !surPiste(piste, q.x, q.z)));

  // Construction du réseau
  const niv = LEVELS[1], rs = creerReseau(niv), pomp = noeudReseau(rs, 'pompage');
  rs.budget = 2000000;                                 // budget large pour tester tout le réseau
  const b0 = rs.budget;
  const g1 = poserRegard(niv, rs, -40, 120), g2 = poserRegard(niv, rs, -30, 60);
  verifier('Construction : poser deux regards coûte 2 × 8 000 €', g1.ok && g2.ok && b0 - rs.budget === 16000, `budget ${rs.budget} €`);
  verifier('Construction : refus d\'un regard trop près d\'un autre', !poserRegard(niv, rs, -35, 117).ok);
  verifier('Construction : refus d\'un regard dans la retenue', !poserRegard(niv, rs, RETENUE_COMBE.x, RETENUE_COMBE.z).ok);
  verifier('Eau : impossible de partir d\'un regard pas encore alimenté', !devisTranchee(niv, rs, g2.id, g1.id, 'eau').ok);
  verifier('Eau : impossible de partir d\'un départ électrique', !devisTranchee(niv, rs, 'elec1', g1.id, 'eau').ok);
  const e1 = ajouterTranchee(niv, rs, 'pompage', g1.id, 'eau');
  verifier('Eau : la salle de pompage alimente le regard 1, au prix de la tranchée eau seule',
    e1.ok && alimentes(rs, 'eau').has(g1.id) && e1.cout === Math.round(e1.longueur * 750), `${m(e1.longueur)}, ${e1.cout} €`);
  ajouterTranchee(niv, rs, g1.id, g2.id, 'eau');
  const s2 = etatRegard(niv, rs, g2.id);
  verifier('Regard 2 : de l\'eau mais pas d\'électricité → « il manque l\'électricité »', s2.eau && !s2.elec && s2.manque === 'l\'électricité');
  verifier('Électricité : impossible de partir d\'un regard pas encore alimenté', !devisTranchee(niv, rs, g1.id, g2.id, 'cable').ok);
  ajouterTranchee(niv, rs, 'elec1', g1.id, 'cable');
  const c2 = ajouterTranchee(niv, rs, g1.id, g2.id, 'cable');
  verifier('Tranchée commune : le câble dans une tranchée déjà creusée ne coûte que la différence (900 − 750 = 150 €/m)',
    c2.ok && c2.commune && c2.parMetre === 150 && c2.cout === Math.round(c2.longueur * 150), `${c2.cout} €`);
  const s2b = etatRegard(niv, rs, g2.id), L2 = longueursEau(rs).get(g2.id);
  verifier('Regard 2 prêt : eau et électricité raccordées', s2b.pret);
  verifier('Pression au regard 2 : formule avec la longueur de conduite depuis le pompage', proche(s2b.pression,
    pressionRegard({ pPompes: CONFIG.pression.pompes, longueur: L2, denivele: altitude(t, -30, 60) - altitude(t, pomp.x, pomp.z), debit: 0 })), `${s2b.pression.toFixed(1)} bar, ${m(L2)} de conduite`);
  const g3 = poserRegard(niv, rs, -130, 95);
  verifier('Tranchée : impossible de traverser la retenue', g3.ok && !devisTranchee(niv, rs, 'pompage', g3.id, 'eau').ok);
  while(annulerAction(rs).ok);
  verifier('Annuler : tout est remboursé et le réseau revient à zéro', rs.budget === b0 && rs.noeuds.length === 1 + niv.departsElec.length && !rs.tranchees.length, `budget ${rs.budget} €`);
  const dir = directionVersPiste(niv.pistes, 70, 0);
  verifier('Un canon à droite de la piste souffle vers la gauche (vers la piste)', dir < -45 && dir > -135, `${dir}°`);

  const r1 = alea(42), r2 = alea(42);
  verifier('Hasard : la même graine redonne les mêmes nombres', [1, 2, 3].every(() => r1() === r2()));

  return res;
}

/* =====================================================================================
   4. MODELES 3D — terrain, décor, canon, regard, salle de pompage, armoire électrique, télésiège
   Formes simples assemblées par le code. Les pièces fixes d'un objet sont fusionnées en une seule
   forme (rapide à afficher) ; les pièces qui bougent (hélice, couvercle, aiguilles…) restent à part.
   ===================================================================================== */

const COULEURS = {
  neige: '#9FB0CF', neigeBord: '#C9D5EA', piste: '#F2F6FD', rocher: '#4F586A', bache: '#363E4C',
  sapin: '#1E4A3A', sapinNeige: '#E6EEF8', tronc: '#4A3426',
  beton: '#8E949B', betonClair: '#A7ADB3', galva: '#9AA3AD', acier: '#5D6B7A', acierFonce: '#3B4250', noir: '#1C1F25',
  canon: '#F2C230', canonBande: '#2B3240', buse: '#E6E9ED',
  moteur: '#2F5FB3', pompe: '#A3322B', volant: '#D7263D', jaune: '#F2C230', orange: '#E58A1F',
  conduiteEau: '#4A6C8E', armoire: '#C5CBD2', mur: '#B7AE9F', toit: '#4A5363', neigeToit: '#EEF3FA',
  bois: '#7A5638', siege: '#2F6FDE', fenetre: '#FFD58A', eau: '#173A63',
  reseauEau: '#3D9BFF', reseauElec: '#FFD23A',

// Matériaux partagés
const _materiaux = {};
function materiau(type){
  if(!_materiaux[type]){
    if(type === 'sommets') _materiaux[type] = new THREE.MeshLambertMaterial({ vertexColors: true });
    else if(type === 'sommets2') _materiaux[type] = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
    else if(type === 'lumineux') _materiaux[type] = new THREE.MeshBasicMaterial({ vertexColors: true });
  }
  return _materiaux[type];
}

// Assemble plusieurs formes en une seule, avec une couleur par sommet et un ombrage plat (low-poly)
function fusionner(parts){
  const pos = [], nor = [], col = [], c = new THREE.Color();
  for(const p of parts){
    const g = p.geo.index ? p.geo.toNonIndexed() : p.geo.clone();
    if(p.matrice) g.applyMatrix4(p.matrice);
    else if(p.pos) g.translate(p.pos[0], p.pos[1], p.pos[2]);
    g.computeVertexNormals();                      // une normale par facette : ombrage plat
    const P = g.attributes.position, N = g.attributes.normal;
    for(let i = 0; i < P.count; i++){
      pos.push(P.getX(i), P.getY(i), P.getZ(i));
      nor.push(N.getX(i), N.getY(i), N.getZ(i));
      c.set(typeof p.couleur === 'function' ? p.couleur(P.getX(i), P.getY(i), P.getZ(i)) : p.couleur);
      col.push(c.r, c.g, c.b);
    }
    g.dispose(); p.geo.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return geo;
}

// Position + rotation (radians) + échelle → matrice
function matrice(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1){
  return new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(s, s, s));
}

// Atelier : on y pose des pièces (boîtes, cylindres, tubes…) puis on les fusionne en une seule forme
class Atelier {
  constructor(){ this.parts = []; this.pile = [new THREE.Matrix4()]; }
  // Toutes les pièces posées dans fn() sont placées dans le repère m (déplacé, tourné)
  repere(m, fn){ this.pile.push(this.pile[this.pile.length - 1].clone().multiply(m)); fn(); this.pile.pop(); return this; }
  ajouter(geo, couleur, m = null){
    const base = this.pile[this.pile.length - 1];
    this.parts.push({ geo, couleur, matrice: m ? base.clone().multiply(m) : base.clone() });
    return this;
  }
  boite(w, h, d, couleur, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0){
    return this.ajouter(new THREE.BoxGeometry(w, h, d), couleur, matrice(x, y, z, rx, ry, rz));
  }
  // Cylindre vertical (axe y) ; on le couche avec rx (axe z) ou rz (axe x)
  cylindre(r, h, couleur, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, seg = 12, rHaut = r, ouvert = false){
    return this.ajouter(new THREE.CylinderGeometry(rHaut, r, h, seg, 1, ouvert), couleur, matrice(x, y, z, rx, ry, rz));
  }
  // Cylindre tendu entre deux points a et b ([x, y, z]) : tuyaux, barres, bras
  tube(a, b, r, couleur, seg = 10){
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A), l = d.length();
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    const m = new THREE.Matrix4().compose(A.add(B).multiplyScalar(0.5), q, new THREE.Vector3(1, 1, 1));
    return this.ajouter(new THREE.CylinderGeometry(r, r, l, seg), couleur, m);
  }
  // Anneau (tore) dans le plan xy ; rx = π/2 pour le coucher à plat
  tore(R, r, couleur, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, segR = 6, segT = 20){
    return this.ajouter(new THREE.TorusGeometry(R, r, segR, segT), couleur, matrice(x, y, z, rx, ry, rz));
  }
  sphere(r, couleur, x = 0, y = 0, z = 0, seg = 8){
    return this.ajouter(new THREE.SphereGeometry(r, seg, Math.max(4, Math.round(seg * 0.75))), couleur, matrice(x, y, z));
  }
  geometrie(){ return fusionner(this.parts); }
  mesh(type = 'sommets', ombres = true){
    const m = new THREE.Mesh(this.geometrie(), materiau(type));
    m.castShadow = ombres; m.receiveShadow = true;
    return m;
  }
}

// Bride boulonnée autour d'un tuyau : dans le repère m (axe du tuyau = y local)
function bride(a, m, r, couleur = COULEURS.acier, boulons = 8){
  a.repere(m, () => {
    a.cylindre(r + 0.07, 0.05, couleur, 0, 0, 0, 0, 0, 0, 14);
    for(let k = 0; k < boulons; k++){
      const ang = k / boulons * Math.PI * 2;
      a.cylindre(0.014, 0.1, COULEURS.acierFonce, Math.cos(ang) * (r + 0.04), 0, Math.sin(ang) * (r + 0.04), 0, 0, 0, 6);
    }
  });
}
// Volant de vanne (rouge) dans le plan xy du repère courant
function volant(a, R, couleur = COULEURS.volant){
  a.tore(R, R * 0.12, couleur, 0, 0, 0, 0, 0, 0, 5, 16);
  for(let k = 0; k < 3; k++){
    const ang = k / 3 * Math.PI * 2 + Math.PI / 2;
    a.tube([0, 0, 0], [Math.cos(ang) * R, Math.sin(ang) * R, 0], R * 0.07, couleur, 5);
  }
  a.cylindre(R * 0.2, R * 0.25, couleur, 0, 0, 0, Math.PI / 2, 0, 0, 8);
}

// --- Textures dessinées par le code ---
function canvasTexture(w, h, dessin){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  dessin(g, w, h);
  const tex = new THREE.CanvasTexture(cv);
  tex.userData = { cv, g };
  return tex;
}
// Angle (sur le cadran dessiné) correspondant à une pression : de 0 bar en bas à gauche à cadranMax en bas à droite
function angleCadran(bar){ return (135 + borne(bar, 0, CONFIG.pression.cadranMax) / CONFIG.pression.cadranMax * 270) * Math.PI / 180; }
let _texCadran = null;
function textureCadran(){
  if(_texCadran) return _texCadran;
  const max = CONFIG.pression.cadranMax, z = CONFIG.pression.zones;
  return _texCadran = canvasTexture(256, 256, g => {
    g.fillStyle = '#F4F2EA'; g.beginPath(); g.arc(128, 128, 124, 0, Math.PI * 2); g.fill();
    g.lineWidth = 8; g.strokeStyle = '#2B3240'; g.stroke();
    const arc = (a, b, c) => { g.beginPath(); g.arc(128, 128, 96, angleCadran(a), angleCadran(b)); g.strokeStyle = c; g.lineWidth = 16; g.stroke(); };
    arc(0, z.arret, '#D7263D'); arc(z.arret, z.faible, '#F29B30'); arc(z.faible, z.correcte, '#2E9E5B');
    arc(z.correcte, z.surpression, '#F29B30'); arc(z.surpression, max, '#D7263D');
    g.strokeStyle = '#1C1F25'; g.fillStyle = '#1C1F25'; g.font = 'bold 22px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for(let b = 0; b <= max; b += 2){
      const a = angleCadran(b), long = b % 10 === 0;
      g.lineWidth = long ? 4 : 2;
      g.beginPath(); g.moveTo(128 + Math.cos(a) * (long ? 76 : 84), 128 + Math.sin(a) * (long ? 76 : 84)); g.lineTo(128 + Math.cos(a) * 104, 128 + Math.sin(a) * 104); g.stroke();
      if(long) g.fillText(String(b), 128 + Math.cos(a) * 58, 128 + Math.sin(a) * 58);
    }
    g.font = 'bold 20px system-ui, sans-serif'; g.fillText('bar', 128, 190);
  });
}
// Panneau « danger électrique » : triangle jaune et éclair noir
let _texDanger = null;
function textureDanger(){
  return _texDanger || (_texDanger = canvasTexture(128, 112, g => {
    g.fillStyle = '#F2C230'; g.strokeStyle = '#1C1F25'; g.lineWidth = 8; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(64, 6); g.lineTo(122, 106); g.lineTo(6, 106); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#1C1F25';
    g.beginPath(); g.moveTo(70, 30); g.lineTo(46, 72); g.lineTo(62, 72); g.lineTo(54, 98); g.lineTo(82, 58); g.lineTo(66, 58); g.lineTo(76, 30); g.closePath(); g.fill();
  }));
}
// Étiquette flottante au-dessus d'un objet (taille fixe à l'écran)
function creerEtiquette(texte, couleur = '#E9B949'){
  const police = 'bold 40px "Bricolage Grotesque", system-ui, sans-serif';
  const mesure = document.createElement('canvas').getContext('2d');
  mesure.font = police;
  const w = Math.ceil(mesure.measureText(texte).width) + 56, h = 72;
  const tex = canvasTexture(w, h, g => {
    g.fillStyle = 'rgba(11,20,38,.88)'; g.strokeStyle = couleur; g.lineWidth = 4;
    g.beginPath(); g.moveTo(18, 2); g.arcTo(w - 2, 2, w - 2, h - 2, 16); g.arcTo(w - 2, h - 2, 2, h - 2, 16); g.arcTo(2, h - 2, 2, 2, 16); g.arcTo(2, 2, w - 2, 2, 16); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = '#EAF2FF'; g.font = police; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(texte, w / 2, h / 2 + 2);
  });

  const hauteur = 0.042;
  sp.scale.set(hauteur * w / h, hauteur, 1);
