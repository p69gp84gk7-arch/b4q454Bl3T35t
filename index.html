<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GMAO Maintenance Neige</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* ========================================================================= */
        /* SECTION 1 : VARIABLES & RESET GLOBAL                                      */
        /* ========================================================================= */
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --bg-color: #f4f6f8;
            --topbar-height: 60px;
            --sheet-banner-height: 80px;
            --sheet-half-height: 50vh;
            --sheet-full-height: 90vh;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            overflow: hidden; /* Bloque le scroll global natif */
            touch-action: none; /* Nécessaire pour le drag du bottom sheet */
        }

        /* ========================================================================= */
        /* SECTION 2 : TOPBAR (BANDEAU SUPÉRIEUR)                                    */
        /* ========================================================================= */
        #topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--topbar-height);
            background: var(--primary);
            z-index: 4000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            color: white;
        }

        .burger-btn {
            background: none; border: none; color: white;
            font-size: 24px; cursor: pointer; padding: 5px;
        }

        .top-actions {
            display: flex; gap: 10px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer;
        }

        /* ========================================================================= */
        /* SECTION 3 : SIDEBAR GAUCHE (MENU BURGER)                                  */
        /* ========================================================================= */
        #left-sidebar {
            position: fixed; top: var(--topbar-height); left: 0; bottom: 0;
            width: 300px; max-width: 85vw;
            background: #fff; z-index: 3500;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        #left-sidebar.open {
            transform: translateX(0);
        }

        .menu-overlay {
            position: fixed; top: var(--topbar-height); left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 3499;
            display: none;
        }

        .menu-overlay.active { display: block; }

        /* ========================================================================= */
        /* SECTION 4 : CONTENEURS PRINCIPAUX (CARTE & LISTES)                        */
        /* ========================================================================= */
        #main-app-area {
            position: absolute; top: var(--topbar-height); left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
        }

        #map-container {
            flex-grow: 1; position: relative; width: 100%; height: 100%; background: #222;
        }

        /* Espace plein écran pour Stock et Atelier (masque la carte et le bottom sheet) */
        #fullscreen-workspace {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 3000; background: var(--bg-color); overflow-y: auto; padding: 15px;
        }

        /* Bouton de Géolocalisation */
        #geo-btn {
            position: absolute; bottom: calc(var(--sheet-banner-height) + 20px); right: 15px;
            width: 45px; height: 45px; border-radius: 50%;
            background: white; border: 2px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; z-index: 2000; cursor: pointer;
        }

        /* ========================================================================= */
        /* SECTION 5 : BOTTOM SHEET (PANNEAU AJUSTABLE DU BAS)                       */
        /* ========================================================================= */
        #bottom-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: white; z-index: 3100;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.15);
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
            /* Hauteur par défaut au lancement */
            height: var(--sheet-banner-height);
        }

        /* La poignée (Drag Handle) pour monter/descendre le panneau */
        .sheet-handle {
            width: 100%; height: 30px;
            display: flex; justify-content: center; align-items: center;
            cursor: grab; flex-shrink: 0;
        }
        
        .sheet-handle::after {
            content: ''; width: 40px; height: 5px;
            background: #bdc3c7; border-radius: 5px;
        }

        /* Contenu défilant à l'intérieur du Bottom Sheet */
        .sheet-content {
            flex-grow: 1; padding: 0 15px 15px 15px;
            overflow-y: auto; touch-action: pan-y;
        }
        
        /* Gestion des 3 états via des classes CSS */
        #bottom-sheet.state-banner { height: var(--sheet-banner-height); }
        #bottom-sheet.state-half { height: var(--sheet-half-height); }
        #bottom-sheet.state-full { height: var(--sheet-full-height); }
    </style>
</head>
<body>

    <div id="topbar">
        <button class="burger-btn" onclick="toggleMenu()">☰</button>
        <div style="font-weight: bold; font-size: 16px;">GMAO Neige</div>
        <div class="top-actions">
            <button class="icon-btn" title="Météo Live">⛅</button>
            <button class="icon-btn" title="Recherche">🔍</button>
        </div>
    </div>

    <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
    <div id="left-sidebar">
        <div style="padding: 15px; font-weight: bold; background: #f8f9fa; border-bottom: 1px solid #eee;">
            Outils d'Analyse
        </div>
        <div style="padding: 15px;">
            <p>Ici, on migrera tes "Themes", "Filtres" et "Calques".</p>
        </div>
    </div>

    <div id="main-app-area">
        <div id="map-container">
            <div id="map" style="width: 100%; height: 100%;"></div>
            <button id="geo-btn" onclick="geolocateUser()">📍</button>
        </div>

        <div id="fullscreen-workspace">
            <h2>Espace Liste (Stock / Atelier)</h2>
            <p>Cet espace masque la carte et le Bottom Sheet.</p>
        </div>
    </div>

    <div id="bottom-sheet" class="state-banner">
        <div class="sheet-handle" id="sheet-handle"></div>
        <div class="sheet-content" id="sheet-content">
            <h3 style="margin-top: 0;">Commandes / Fiche Canon</h3>
            <p>Fais glisser la poignée vers le haut pour voir plus de détails.</p>
            </div>
    </div>

    <script>
        /* ========================================================================= */
        /* LOGIQUE DE L'INTERFACE MOBILE (UI/UX)                                     */
        /* ========================================================================= */

        // 1. Gestion du Menu Burger
        function toggleMenu() {
            const sidebar = document.getElementById('left-sidebar');
            const overlay = document.getElementById('menu-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // 2. Logique du Bottom Sheet (Glissement tactile)
        const sheet = document.getElementById('bottom-sheet');
        const handle = document.getElementById('sheet-handle');
        let startY, startHeight;
        
        // États possibles (en pixels, calculés dynamiquement)
        const getStates = () => [
            80, // Banner
            window.innerHeight * 0.5, // Half
            window.innerHeight * 0.9  // Full
        ];

        handle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            startHeight = sheet.getBoundingClientRect().height;
            sheet.style.transition = 'none'; // Désactive l'animation pendant le drag
        });

        handle.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const deltaY = startY - currentY;
            let newHeight = startHeight + deltaY;
            
            // Limites
            if (newHeight < 80) newHeight = 80;
            if (newHeight > window.innerHeight * 0.9) newHeight = window.innerHeight * 0.9;
            
            sheet.style.height = `${newHeight}px`;
        });

        handle.addEventListener('touchend', () => {
            sheet.style.transition = 'height 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            const currentHeight = sheet.getBoundingClientRect().height;
            const states = getStates();
            
            // Trouve l'état le plus proche pour créer un effet "Aimant" (Snap)
            const closest = states.reduce((prev, curr) => 
                Math.abs(curr - currentHeight) < Math.abs(prev - currentHeight) ? curr : prev
            );

            // Applique les classes CSS selon la hauteur trouvée
            sheet.classList.remove('state-banner', 'state-half', 'state-full');
            sheet.style.height = ''; // On vide le style inline pour laisser le CSS gérer

            if (closest === states[0]) sheet.classList.add('state-banner');
            else if (closest === states[1]) sheet.classList.add('state-half');
            else sheet.classList.add('state-full');
        });

        // 3. Bouton de Géolocalisation
        function geolocateUser() {
            if (navigator.geolocation) {
                // Remplacer l'alerte par la fonction Leaflet map.locate() à l'étape 2
                alert("Recherche de votre position GPS..."); 
            } else {
                alert("La géolocalisation n'est pas supportée par ce navigateur.");
            }
        }
    </script>
</body>
</html>
