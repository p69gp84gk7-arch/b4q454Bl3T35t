    <circle cx="441" cy="277" r="10" fill="#1A1A1A"/>
    <circle cx="414" cy="304" r="10" fill="#1A1A1A"/>
    <circle cx="387" cy="331" r="10" fill="#1A1A1A"/>
    <circle cx="441" cy="331" r="10" fill="#1A1A1A"/>
  </g>
