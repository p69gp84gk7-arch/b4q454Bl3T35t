<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Le Gobelet</title>
  <defs>
    <radialGradient id="felt" cx="50%" cy="25%" r="85%">
      <stop offset="0" stop-color="#2A7358"/>
      <stop offset="1" stop-color="#123A2C"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" x2="1">
      <stop offset="0" stop-color="#9E2820"/>
      <stop offset=".4" stop-color="#D8473C"/>
      <stop offset="1" stop-color="#8C221B"/>
