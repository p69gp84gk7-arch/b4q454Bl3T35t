    <rect x="254" y="318" width="128" height="128" rx="26" fill="#F7F3E8" stroke="#1A1A1A" stroke-width="8"/>
    <circle cx="318" cy="382" r="19" fill="#C8372D"/>
  </g>
  <!-- Dé : le 5 -->
  <g transform="rotate(-14 414 304)">
